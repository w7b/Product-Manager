# Testes rodam em um H2 em memória (modo PostgreSQL), sem precisar de banco instalado.
spring:
  datasource:
    url: jdbc:h2:mem:pm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    baseline-on-migrate: false
